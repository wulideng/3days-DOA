<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三日棋局·孤影</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'SimSun', 'STKaiti', serif; 
            background: linear-gradient(to bottom, #f4ecd8 0%, #e8dfca 100%); 
            min-height: 100vh; 
            color: #3c2f1c; 
            padding: 20px;
        }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        .screen { display: none; text-align: center; padding: 60px 20px; }
        .screen.active { display: block; }
        .main-title { font-size: 3.5em; color: #5d432c; margin-bottom: 20px; letter-spacing: 12px; font-weight: bold; }
        .subtitle { font-size: 1.5em; color: #8b7355; letter-spacing: 5px; margin-bottom: 40px; }
        
        .btn { padding: 15px 50px; background: #8b7355; color: #f8f4e9; border: none; font-size: 1.2em; cursor: pointer; border-radius: 5px; margin: 10px; font-family: inherit; transition: 0.3s; }
        .btn:hover { background: #a0522d; transform: scale(1.05); }
        
        .status-bar { background: #e8dfca; border: 2px solid #8b7355; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .stat-box { text-align: center; padding: 10px; background: #f8f4e9; border-radius: 8px; border: 1px solid #dcd3bc; }
        .stat-label { font-size: 0.85em; color: #8b7355; font-weight: bold; margin-bottom: 5px; }
        .stat-value { font-size: 1.4em; font-weight: bold; color: #5d432c; }
        .stat-bar { height: 6px; background: #e0d6c2; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .stat-fill { height: 100%; transition: width 0.5s; }
        .suspicion-fill { background: #a0522d; }
        .network-fill { background: #556b2f; }
        .trust-fill { background: #8b0000; }
        
        .game-scene { background: #f8f4e9; border: 2px solid #8b7355; border-radius: 10px; padding: 30px; min-height: 400px; }
        .scene-title { font-size: 1.4em; color: #5d432c; margin-bottom: 20px; font-weight: bold; }
        .scene-text { font-size: 1.15em; line-height: 2; margin-bottom: 30px; white-space: pre-line; }
        
        .actions { display: grid; gap: 12px; }
        .action-btn { padding: 18px; background: #8b7355; color: #f8f4e9; border: 1px solid #5d432c; border-radius: 8px; cursor: pointer; text-align: left; font-family: inherit; font-size: 1.05em; transition: 0.3s; }
        .action-btn:hover:not(:disabled) { background: #a0522d; padding-left: 25px; }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; text-decoration: line-through; }
        
        .feedback-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .feedback-overlay.active { display: flex; }
        .feedback-box { background: #f8f4e9; border: 3px solid #8b7355; border-radius: 15px; padding: 40px; max-width: 600px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .feedback-title { font-size: 1.2em; color: #8b7355; margin-bottom: 20px; text-align: center; border-bottom: 1px dashed #8b7355; padding-bottom: 10px; }
        .feedback-text { font-size: 1.15em; line-height: 2; margin-bottom: 20px; white-space: pre-line; }
        .feedback-changes { background: #e8dfca; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95em; text-align: center; }
        
        .chronicle { background: #e8dfca; border: 2px solid #8b7355; border-radius: 10px; padding: 15px; margin-top: 20px; max-height: 200px; overflow-y: auto; }
        .chronicle-title { font-size: 1em; color: #8b7355; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #8b7355; padding-bottom: 5px; }
        .chronicle-entry { padding: 8px 0; border-bottom: 1px dashed #c0b8a8; font-size: 0.9em; line-height: 1.6; }
        
        .ending-content { max-width: 700px; margin: 0 auto; background: #f8f4e9; padding: 40px; border: 3px solid #8b7355; border-radius: 15px; }
        .ending-title { font-size: 2em; color: #5d432c; text-align: center; margin-bottom: 30px; letter-spacing: 5px; }
        .ending-text { font-size: 1.15em; line-height: 2.2; white-space: pre-line; margin-bottom: 20px; }
        .ending-stats { margin-top: 30px; border-top: 2px dashed #8b7355; padding-top: 20px; font-size: 0.95em; color: #8b7355; text-align: center; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <div id="titleScreen" class="screen active">
            <h1 class="main-title">三日棋局</h1>
            <div class="subtitle">孤 影 谋 生</div>
            <button class="btn" onclick="showPrologue()">入 局</button>
        </div>

        <div id="prologueScreen" class="screen">
            <div class="ending-content" style="text-align: left;">
                <p style="line-height: 2.2; font-size: 1.15em;">
                    深秋锁城，叛将倒戈。三日后援军方抵，而王府已成孤岛。
                    <br><br>
                    你是王妃座前一名卑微婢女，亦是这死局中最后的一枚暗棋。
                    <br><br>
                    叛将生性多疑，随着局势逼近，戒心更胜往昔。若让那疑虑越过雷池，黎明之前，便是魂断之时。
                    <br><br>
                    乱世如棋，胜负仅在毫厘。每一步抉择，皆是生死惊变。
                </p>
            </div>
            <button class="btn" onclick="startGame()">明 白</button>
        </div>

        <div id="gameScreen" class="screen">
            <div class="status-bar">
                <div class="stat-box">
                    <div class="stat-label">叛将疑心 (限90)</div>
                    <div class="stat-value" id="suspicionValue">30</div>
                    <div class="stat-bar"><div class="stat-fill suspicion-fill" id="suspicionBar"></div></div>
                </div>
                <div class="stat-box" id="secondStatBox">
                    <div class="stat-label">暗流人脉</div>
                    <div class="stat-value" id="secondValue">-</div>
                    <div class="stat-bar"><div class="stat-fill network-fill" id="secondBar"></div></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">随身银钱</div>
                    <div class="stat-value" style="color:#b8860b">￥<span id="goldValue">20</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">身份</div>
                    <div class="stat-value" id="identityValue" style="font-size:1.1em;">未定</div>
                </div>
            </div>

            <div class="game-scene">
                <div class="scene-title" id="sceneTitle"></div>
                <div class="scene-text" id="sceneText"></div>
                <div class="actions" id="actionsContainer"></div>
            </div>

            <div class="chronicle">
                <div class="chronicle-title">📜 案卷记录</div>
                <div id="chronicleEntries"></div>
            </div>
        </div>

        <div id="endingScreen" class="screen">
            <div class="ending-content">
                <h2 class="ending-title" id="endingTitle"></h2>
                <div class="ending-text" id="endingText"></div>
                <div class="ending-stats" id="endingStats"></div>
            </div>
            <button class="btn" onclick="startGame()">再 弈 一 局</button>
            <button class="btn" style="background:#5d432c" onclick="backToTitle()">返 回 标 题</button>
        </div>
    </div>

    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-box">
            <div class="feedback-title" id="feedbackTitle"></div>
            <div class="feedback-text" id="feedbackText"></div>
            <div class="feedback-changes" id="feedbackChanges"></div>
            <button class="btn" onclick="closeFeedback()" style="width:100%">确 认</button>
        </div>
    </div>

    <script>
const initialState = {
    day: 1,
    period: 0, // 0:清晨, 1:午后, 2:深夜
    identity: null, // null, "loyal", "traitor"
    suspicion: 30,
    network: 1,
    trust: 0,
    gold: 20,
    flags: {
        princessDead: false,
        generalDead: false,
        hasWeapon: null, // null, "poison", "blade"
        sentLetter: false,
        hasToken: false, // 王妃信物
        hasAid: false,   // 内应助攻
        betrayed: false  // 指认过暗哨
    }
};
let gameState = {};
let pendingChanges = {};

// ============ 游戏数据库：三日完整场景库 ============
const sceneDatabase = {
    // ==================== DAY 1 ====================
    "D1_0_null": {
        text: "深秋锁城，寒意已透骨。王妃独坐镜前，一夜之间华发暗生。她望向你，这深宫里最后一张熟悉的面孔。",
        actions: [
            {
                text: "【洒扫】如常侍奉，静观其变",
                effect: (gs) => {
                    gs.identity = "loyal";
                    gs.suspicion = Math.max(0, gs.suspicion - 5);
                    gs.network += 1;
                    recordChange("身份", "忠诚");
                    recordChange("疑心", -5);
                    recordChange("人脉", 1);
                },
                feedback: "你低眉顺眼，擦拭着本就光洁的案几。叛将的亲兵从门前经过，目光如鹰扫过，未作停留。此刻的平凡，是最好的伪装。"
            },
			{
                text: "【安抚】递上一杯热茶，稳住王妃心神",
                effect: (gs) => { gs.identity = "loyal"; gs.network += 2; recordChange("人脉", 2); },
                feedback: "王妃接过茶杯，指尖冰凉。她低声说：‘若是城破，你便自己逃吧。’你心中一酸，这情分或许日后能救命。"
            },
            {
                text: "【贿赂】将五两银子塞给门前的传信兵",
                requires: (gs) => gs.gold >= 5,
                effect: (gs) => { gs.identity = "loyal"; gs.gold -= 5; gs.network += 3; gs.suspicion += 5; recordChange("银钱", -5); recordChange("人脉", 3); recordChange("疑心", 5); },
                feedback: "小兵收下银子，吐出一句：‘援军最快也要三日，你主子怕是等不到了。’这情报，重若千金。"
            },
           {
    text: "【投诚】弃主求生（需通关一次解锁）",
    // 门槛：钱足够(20) 或者 通关过一次
    requires: (gs) => localStorage.getItem('gameCleared') === 'true',
    	effect: (gs) => { gs.identity = "traitor"; gs.suspicion += 10; recordChange("身份", "野心"); recordChange("疑心", 10); },
    feedback: "你走向偏厅。叛将横刀而问：“奴婢也配求生？”你直视他：“将军要城，我要权。”"
}        ]
    },
    "D1_1_loyal": {
        text: "厨房的管事嬷嬷悄悄拉住你，塞给你半块馊了的饼。“姑娘，省着点。”她的儿子在城门守军之中，眼里有和你一样的恐惧。",
        actions: [
            {
                text: "【结交】接过饼，低声探问府外消息",
                effect: (gs) => {
                    gs.network += 2;
                    gs.suspicion += 2;
                    recordChange("人脉", 2);
                    recordChange("疑心", 2);
                },
                feedback: "嬷嬷摇头，只指了指西边柴房的方向。那里，或许有通往外界的缝隙。你记下了这份人情。"
            },
            {
                text: "【蛰伏】摇头拒绝，默默离开",
                effect: (gs) => {
                    gs.suspicion = Math.max(0, gs.suspicion - 2);
                    recordChange("疑心", -2);
                },
                feedback: "你不知道这是试探还是真心。在这囚笼里，信任比黄金更奢侈。你选择不吃来历不明的食物。"
            }
        ]
    },
    "D1_1_traitor": {
        text: "叛将扔给你一本破烂的名册。“认得字么？把王妃陪嫁过来的、宫里赏赐的，所有下人的名字，给我圈出来。”",
        actions: [
            {
                text: "【指认】迅速圈出几个可能的忠仆",
                effect: (gs) => {
                    gs.trust += 5;
                    gs.network = Math.max(0, gs.network - 3);
                    gs.flags.betrayed = true;
                    recordChange("信任", 5);
                    recordChange("人脉", -3);
                },
                feedback: "“很好。”他唤来亲兵，低语几句。黄昏时分，那几个名字的主人便从府中消失了。你感到一阵冰冷的战栗，也感到一丝扭曲的安心。"
            },
            {
                text: "【隐瞒】佯装不识，称自己人微言轻",
                effect: (gs) => {
                    gs.suspicion += 8;
                    recordChange("疑心", 8);
                },
                feedback: "“废物。”名册砸在你脸上。你知道，自己错过了一次递投名状的机会，但也暂时远离了血泊。"
            }
        ]
    },
    "D1_2_loyal": {
        text: "王妃高烧不退，梦呓中呼唤着王爷的乳名。窗外月色惨白，药石无灵。",
        actions: [
            {
                text: "【守夜】彻夜不眠，以冷水为王妃拭额",
                effect: (gs) => {
                    gs.network += 1;
                    gs.flags.hasToken = true;
                    recordChange("人脉", 1);
                },
                feedback: "天将明时，高热稍退。王妃醒来看见你充血的双眸，握住你的手，将一个冰凉坚硬的物件——她的玉簪，塞入你掌心。你感激涕零，但指尖触及温润玉石时，心底闪过一丝冰冷的清明：这不仅是赏赐，更是封口费。"
            },
            {
                text: "【求药】冒险去军医处讨要风寒药",
                requires: (gs) => gs.gold >= 5,
                effect: (gs) => {
                    gs.gold -= 5;
                    gs.suspicion += 5;
                    gs.network += 1;
                    recordChange("银钱", -5);
                    recordChange("疑心", 5);
                    recordChange("人脉", 1);
                },
                feedback: "军医斜睨着你，丢来一包药粉。“五两银子。”你咬牙付钱。药或许有用，但这次交易让你在叛军眼里有了“价值”。"
            }
        ]
    },
    "D1_2_traitor": {
        text: "叛将在灯下把玩着一枚玉佩，那是王妃的随身之物。“她说，这是王爷所赠。你说，我是该毁了它，还是……让它换个主人？”",
        actions: [
            {
                text: "【献策】建议他留下，日后或可胁迫王妃",
                requires: (gs) => gs.trust >= 3,
                effect: (gs) => {
                    gs.trust += 3;
                    recordChange("信任", 3);
                },
                feedback: "“哦？你倒想得远。”他将玉佩抛给你，“那就由你保管。她若听话，这玉就还是她的。”你接住的，是一份沉重的“信任”。"
            },
            {
                text: "【表忠】当即摔碎玉佩，以示决裂",
                effect: (gs) => {
                    gs.trust += 5;
                    gs.suspicion += 5;
                    // 早期死亡判定：疑心过高时，过度表忠显得虚伪
                    if (gs.suspicion > 30) {
                        gs._ending = "EARLY_OVERACT";
                    }
                    recordChange("信任", 5);
                    recordChange("疑心", 5);
                },
                feedback: "玉碎之声清脆。叛将先是一愣，随即大笑。“够狠！我喜欢。”你赢得了赞赏，也彻底毁了回头路。"
            }
        ]
    },

    // ==================== DAY 2 ====================
    "D2_0_loyal": {
        text: "晨霜未化，寝宫外传来了急促的脚步声。叛将传令加强搜查，甚至连屏风后的杂物也要翻看。王妃将一封藏在发髻里的密信交给你，眼神中透着绝望的期许。",
        actions: [
            {
                text: "【藏匿】将信缝入破旧的夹袄",
                effect: (gs) => {
                    gs.suspicion += 5;
                    gs.network += 1;
                    recordChange("疑心", 5);
                    recordChange("人脉", 1);
                },
                feedback: "你躲在暗处飞快地飞针走线。信纸被汗水浸湿，却稳稳地藏在了棉絮深处。你告诉自己这是为了忠义，但另一个声音在问：若王爷败了，这封信会不会是新的投名状？"
            },
            {
                text: "【贿赂】重金买通搜查的副将",
                requires: (gs) => gs.gold >= 15 && gs.network >= 2,
                effect: (gs) => {
                    gs.gold -= 15;
                    gs.suspicion = Math.max(0, gs.suspicion - 15);
                    gs.network += 2;
                    gs.flags.hasAid = true;
                    // 早期死亡判定：无人脉基础时贸然行贿
                    if (gs.network < 2) {
                        gs._ending = "EARLY_BRIBE_FAIL";
                    }
                    recordChange("银钱", -15);
                    recordChange("疑心", -15);
                    recordChange("人脉", 2);
                },
                feedback: "你借着整理箱笼的机会，将一块沉甸甸的银锭塞进副将的护腕。他掂了掂重量，心领神会地挥手示意亲兵跳过这间屋子。"
            }
        ]
    },
    "D2_0_traitor": {
        text: "叛将的耐心正在消磨，他看你的眼神越发冰冷。若想让他彻底相信你的价值，你必须为王妃准备一份“无可挽回”的离别礼。",
        actions: [
            {
                text: "【寻刃】故意打碎官窑瓷瓶",
                effect: (gs) => {
                    gs.suspicion += 5;
                    gs.trust += 2;
                    gs.flags.hasWeapon = "blade";
                    recordChange("疑心", 5);
                    recordChange("信任", 2);
                },
                feedback: "你装作手滑，名贵的瓷瓶在地上炸裂。你趁乱捡起一枚最锋利的碎片藏入袖中。瓷片无名无号，恰如深宫怨念，无从查起。"
            },
            {
                text: "【觅毒】从膳房窃取砒霜",
                requires: (gs) => gs.gold >= 10,
                effect: (gs) => {
                    gs.gold -= 10;
                    gs.suspicion += 8;
                    gs.trust += 3;
                    gs.flags.hasWeapon = "poison";
                    recordChange("银钱", -10);
                    recordChange("疑心", 8);
                    recordChange("信任", 3);
                },
                feedback: "你以“房中老鼠惊扰娘娘”为由，获取一包白色的粉末。砒霜，天下剧毒，多来自军中或药库，其源可溯。"
            }
        ]
    },
    "D2_1_loyal": {
        text: "叛将在花园内校场阅兵，看样子今日便要攻城。侧门处的守卫正在换岗，如果你能趁机混出去，或许能将信送达。",
        actions: [
            {
                text: "【闯关】冒险出府传递密信",
                requires: (gs) => gs.network >= 5,
                effect: (gs) => {
                    gs.suspicion += 20;
                    gs.network -= 2;
                    gs.flags.sentLetter = true;
                    // 早期死亡判定：疑心过高时闯关是自投罗网
                    if (gs.suspicion > 65) {
                        gs._ending = "EARLY_CAUGHT";
                    }
                    recordChange("疑心", 20);
                    recordChange("人脉", -2);
                },
                feedback: "你借着送浆洗衣服的机会，利用平日积攒的人情求马夫开了后门。信送出去了，但你回府时被亲兵盯了很久，呼吸声清晰可见。"
            },
            {
                text: "【蛰伏】搜查太严，按兵不动",
                effect: (gs) => {
                    gs.suspicion = Math.max(0, gs.suspicion - 5);
                    recordChange("疑心", -5);
                },
                feedback: "你看着严密的封锁线，理智地退了回来。但你深知，这何尝不是在观望？你在等一个更明确的胜负信号，再押上全部的筹码。"
            }
        ]
    },
    "D2_1_traitor_poison": {
        text: "佛堂内檀香袅袅，王妃正背对着你礼佛。你手中的茶碗还冒着热气，那包无色无味的砒霜已尽数没入汤中。",
        actions: [
            {
                text: "【投毒】亲手服侍王妃饮下。",
                requires: (gs) => gs.trust >= 5,
                effect: (gs) => {
                    gs.suspicion = Math.max(0, gs.suspicion - 10);
                    gs.trust += 5;
                    gs.flags.princessDead = true;
                    gs.flags.hasWeapon = null;
                    recordChange("疑心", -10);
                    recordChange("信任", 5);
                },
                feedback: "你柔声劝慰：“娘娘，早些喝了汤药吧。”她毫无防备饮下，沉沉睡去，但你知道，她不会再醒了。你立了首功，但在这府里，你再也没有回头路了。"
            },

// ============ 游戏引擎函数 ============
function showPrologue() {
    document.getElementById('titleScreen').classList.remove('active');
    document.getElementById('prologueScreen').classList.add('active');
}
function startGame() {
    gameState = JSON.parse(JSON.stringify(initialState));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('gameScreen').classList.add('active');
    document.getElementById('chronicleEntries').innerHTML = '';
    document.getElementById('actionsContainer').innerHTML = '';  // ← 加这一行！清空旧按钮
    loadScene();
}

function backToTitle() { location.reload(); } // 直接刷新页面最保险

function getSceneKey() {
    const { day, period, identity, flags } = gameState;
    // 处理结局场景
    if (gameState._ending) return `ENDING_${gameState._ending}`;

    // 标准场景键名
    let key = `D${day}_${period}`;
    if (identity) key += `_${identity}`;
    else key += '_null';

    // --- 处理特殊分支场景 ---
    // D2 午后野心线，根据武器类型进入不同分支
    if (day === 2 && period === 1 && identity === 'traitor') {
        if (flags.hasWeapon === 'poison') key += '_poison';
        else if (flags.hasWeapon === 'blade') key += '_blade';
        else key += '_none';
    }
    // D2 深夜野心线，根据任务成功/失败进入不同分支
    if (day === 2 && period === 2 && identity === 'traitor') {
        if (flags.princessDead) key += '_success';
        else key += '_fail';
    }
    // D3 清晨野心线，根据王妃生死进入不同分支
    if (day === 3 && period === 0 && identity === 'traitor') {
        if (flags.princessDead) key += '_dead';
        else key += '_alive';
    }

    return key;
}

function loadScene() {

    // 1. 检查并处理即时结局...
    // 1. 检查并处理即时结局（如疑心过高）
    const immediateEnding = checkImmediateEnding();
    if (immediateEnding) {
        showEnding(immediateEnding);
        return;
    }

    const sceneKey = getSceneKey();
    const scene = sceneDatabase[sceneKey];

    // 如果找不到场景，使用默认保底场景
    if (!scene) {
        console.warn("未找到场景:", sceneKey);
        const fallbackScene = {
            text: `【第${gameState.day}天·${getPeriodName()}】\n\n局势紧张，你选择暂避风头。`,
            actions: [{
                text: "【蛰伏】静观其变",
                effect: (gs) => { gs.suspicion = Math.max(0, gs.suspicion - 2); recordChange("疑心", -2); },
                feedback: "你选择暂不出手。"
            }]
        };
        renderScene(fallbackScene);
        return;
    }

    renderScene(scene);
}

function renderScene(scene) {
    // 渲染标题和文本内容
    document.getElementById('sceneTitle').textContent = `第${gameState.day}天 · ${getPeriodName()}`;
    document.getElementById('sceneText').textContent = scene.text;

    const container = document.getElementById('actionsContainer');
    container.innerHTML = '';

    // 遍历生成按钮
    scene.actions.forEach(action => {
        // --- 核心：如果不满足 requires 条件，直接跳过不显示这个按钮 ---
        if (action.requires && !action.requires(gameState)) return;

        const btn = document.createElement('button');
        btn.className = 'action-btn';
        btn.textContent = action.text;
        
        btn.onclick = () => {
            pendingChanges = {};
            if (action.effect) action.effect(gameState);
            // 如果有结果文字就显示在下方，没有就直接跳时间
            if (action.feedback) showFeedback(action.text, action.feedback);
            else nextPeriod();
        };
        container.appendChild(btn);
    });
    updateDisplay();
} 

function updateDisplay() {
    // 更新顶部数值
    document.getElementById('suspicionValue').textContent = gameState.suspicion;
    document.getElementById('suspicionBar').style.width = gameState.suspicion + '%';
    document.getElementById('goldValue').textContent = gameState.gold;
    document.getElementById('identityValue').textContent = gameState.identity === 'loyal' ? '忠诚' : (gameState.identity === 'traitor' ? '野心' : '未定');

    // --- 数值警报：当疑心 >= 70 时，数值变红且框体变红 ---
    const suspBox = document.getElementById('suspicionValue').parentElement;
    if (gameState.suspicion >= 70) {
        document.getElementById('suspicionValue').style.color = "red";
        suspBox.style.border = "2px solid red"; 
    } else {
        document.getElementById('suspicionValue').style.color = "#5d432c";
        suspBox.style.border = "1px solid #dcd3bc";
    }

    // 更新第二属性（人脉/信任）
    const secondBox = document.getElementById('secondStatBox');
    if (gameState.identity === 'traitor') {
        secondBox.querySelector('.stat-label').textContent = '叛将信任';
        document.getElementById('secondValue').textContent = gameState.trust;
        document.getElementById('secondBar').className = 'stat-fill trust-fill';
        document.getElementById('secondBar').style.width = (gameState.trust * 5) + '%';
    } else {
        secondBox.querySelector('.stat-label').textContent = '暗流人脉';
        document.getElementById('secondValue').textContent = gameState.network;
        document.getElementById('secondBar').className = 'stat-fill network-fill';
        document.getElementById('secondBar').style.width = (gameState.network * 10) + '%';
    }
}

function getPeriodName() {
    return ['清晨', '午后', '深夜'][gameState.period];
}

function recordChange(attr, value) {
    if (typeof value === 'number') {
        pendingChanges[attr] = (pendingChanges[attr] || 0) + value;
    } else {
        pendingChanges[attr] = value;
    }
}

function showFeedback(title, text) {
    // 1. 获取文字区域，把反馈文字直接接在剧情后面
    const sceneTextDiv = document.getElementById('sceneText');
    sceneTextDiv.innerHTML += `<br><br><div style="color:#a0522d; padding:15px; background:rgba(139,115,85,0.05); border-left:4px solid #a0522d; font-style:italic;">${text}</div>`;
    
    // 2. 显示涨跌了多少数值，加在反馈文字下面
    let changesHtml = '<div style="margin-top:10px; text-align:center; font-weight:bold;">';
    for (let [key, value] of Object.entries(pendingChanges)) {
        const color = (typeof value === 'number' && value > 0) ? '#8b0000' : '#228b22';
        const sign = value > 0 ? '+' : '';
        changesHtml += `<span style="margin:0 10px; color:${color}">${key} ${sign}${value}</span>`;
    }
    changesHtml += '</div>';
    sceneTextDiv.innerHTML += changesHtml;

    // 3. 删掉原来所有选项按钮，换成一个唯一的“继续”按钮
    const container = document.getElementById('actionsContainer');
    container.innerHTML = `<button class="btn" style="width:100%; background:#5d432c;" onclick="nextPeriod()">步入下一刻 (推进剧情)</button>`;
    
    // 4. 更新日志和顶部显示
    addChronicle(title, text);
    updateDisplay();
}


function closeFeedback() {
    document.getElementById('feedbackOverlay').classList.remove('active');
	updateDisplay();  // ← 加这一行！
    nextPeriod();
}

function addChronicle(title, text) {
    const entry = document.createElement('div');
    entry.className = 'chronicle-entry';
    entry.innerHTML = `<strong>${title}</strong><br>${text.split('\n')[0]}...`;
    document.getElementById('chronicleEntries').prepend(entry);
}

function nextPeriod() {
    // 先检查是否有触发的结局（如早期死亡标记）
    const ending = checkImmediateEnding();
    if (ending) {
        showEnding(ending);
        return;
    }

    // 随时间自动增长的疑心（模拟局势紧张）
    const growth = gameState.day === 1 ? 2 : (gameState.day === 2 ? 3 : 4);
    gameState.suspicion += growth;

    // 推进时间
    gameState.period++;
    if (gameState.period > 2) {
        gameState.period = 0;
        gameState.day++;
    }

    // 检查是否到达最终结算日
    if (gameState.day > 3) {
        const finalEnding = calculateFinalEnding();
        showEnding(finalEnding);
        return;
    }

    loadScene();
}

function checkImmediateEnding() {
    const g = gameState;
    // 1. 疑心过高
    if (g.suspicion >= 90) return "BEATEN";
    // 2. 早期死亡标记
    if (g._ending && g._ending.startsWith("EARLY_")) return g._ending;
    // 3. 野心线在D3被直接清算
    if (g._ending === "TRAITOR_DOUBLE_FAIL") return g._ending;
    return null;
}

function calculateFinalEnding() {
    const g = gameState;
    if (g.identity === "loyal") {
        if (g.network >= 8 && g.flags.hasToken && !g.flags.sentLetter) return "LOYAL_SHADOW";
        if (g.flags.princessSafe && g.network >= 5) return "LOYAL_VICTORY";
        if (g.suspicion < 90) return "LOYAL_SURVIVE";
        return "DEFAULT";
    } else if (g.identity === "traitor") {
        if (g.flags.princessDead && g.flags.generalDead && g.trust >= 15) return "TRAITOR_PERFECT";
        if (g.flags.princessDead && !g.flags.generalDead) return "TRAITOR_BETRAYED";
        if (g.trust >= 15) return "TRAITOR_SHADOW";
        if (g.suspicion < 50) return "TRAITOR_SURVIVE";
        return "TRAITOR_FAILED";
    }
    return "DEFAULT";
}

function showEnding(endingId) {
// === 就是这一行！只要进入结局，就给玩家发个“通关证” ===
    localStorage.setItem('gameCleared', 'true');   
 const ending = endingTexts[endingId] || endingTexts["DEFAULT"];
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('endingScreen').classList.add('active');
    document.getElementById('endingTitle').textContent = ending.title;
    document.getElementById('endingText').textContent = ending.text;

    // 显示最终数据
    const statsText = `最终数据 —— 疑心：${gameState.suspicion} | ${gameState.identity === 'loyal' ? '人脉' : '信任'}：${gameState.identity === 'loyal' ? gameState.network : gameState.trust} | 银钱：${gameState.gold}`;
    document.getElementById('endingStats').textContent = statsText;
}

// ============ 初始化 ============
// 页面加载完成后，无需额外操作，点击按钮即可开始游戏
    </script>
