<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三日棋局 · 婢女求生</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'SimSun', 'STKaiti', serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f4ecd8; background-image: linear-gradient(to bottom, #f4ecd8 0%, #e8dfca 100%); min-height: 100vh; color: #3c2f1c; }
        
        /* 全屏界面通用 */
        .full-screen { text-align: center; padding: 60px 20px; }
        .main-title { font-size: 3.5em; color: #5d432c; margin-bottom: 10px; letter-spacing: 12px; font-weight: bold; }
        .btn-large { padding: 15px 50px; background: #8b7355; color: #f8f4e9; border: none; font-size: 1.2em; cursor: pointer; border-radius: 5px; transition: 0.3s; margin: 15px; font-family: inherit; }
        .btn-large:hover { background: #a0522d; transform: scale(1.02); }

        /* 状态栏 */
        .game-status { background: #e8dfca; border: 2px solid #8b7355; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .stat-box { text-align: center; padding: 8px; background: #f8f4e9; border-radius: 8px; border: 1px solid #dcd3bc; }
        .stat-label { font-size: 0.8em; color: #8b7355; font-weight: bold; }
        .stat-value { font-size: 1.3em; font-weight: bold; color: #5d432c; }
        .progress-container { height: 6px; background: #e0d6c2; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .suspicion-fill { height: 100%; background: #a0522d; width: 0%; transition: width 0.5s; }
        .network-fill { height: 100%; background: #556b2f; width: 0%; transition: width 0.5s; }

        /* 场景展示区 */
        .scene-container { background: #f8f4e9; border: 2px solid #8b7355; border-radius: 10px; padding: 30px; min-height: 300px; }
        .scene-text { font-size: 1.2em; white-space: pre-line; margin-bottom: 25px; line-height: 2; text-align: left; }
        .actions-container { display: grid; gap: 12px; }
        .action-btn { padding: 16px; background: #8b7355; color: #f8f4e9; border: 1px solid #5d432c; border-radius: 8px; cursor: pointer; text-align: left; font-family: inherit; font-size: 1em; }
        .action-btn:hover:not(:disabled) { background: #a0522d; padding-left: 20px; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; text-decoration: line-through; }

        .game-log { background: #e8dfca; border: 1px solid #8b7355; border-radius: 10px; padding: 12px; margin-top: 15px; height: 120px; overflow-y: auto; font-size: 0.9em; text-align: left; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="titleScreen" class="full-screen">
        <h1 class="main-title">三日棋局</h1>
        <div style="font-size: 1.5em; color: #8b7355; letter-spacing: 5px;">孤 影 谋 生</div>
        <button class="btn-large" onclick="showPrologue()">入 局</button>
    </div>

    <div id="prologueScreen" class="full-screen hidden">
        <div style="max-width: 600px; margin: 0 auto; background: #f8f4e9; padding: 40px; border: 2px solid #8b7355; border-radius: 15px; text-align: left; line-height: 2.2; font-size: 1.15em;">
            深秋锁城，将军反戈。三日后援军方抵，而王府已成孤岛。
            你是王妃座前一名卑微婢女，亦是这死局中最后的一枚暗棋。
            <br><br>
            将军生性多疑，随着局势逼近，戒心更胜往昔。若让那疑虑越过九十分的雷池，黎明之前，便是魂断之时。
            <br><br>
            乱世如棋，胜负仅在毫厘。每一步抉择，皆是生死之辩。
        </div>
        <button class="btn-large" onclick="startGame()">明 白</button>
    </div>

    <div id="gameContainer" class="hidden">
        <div class="game-status">
            <div class="stat-box">
                <div class="stat-label">将军疑心 (限 90)</div>
                <div class="stat-value" id="suspicionValue">30</div>
                <div class="progress-container"><div class="suspicion-fill" id="suspicionBar"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">暗流人脉 (极 9)</div>
                <div class="stat-value" id="networkValue">1</div>
                <div class="progress-container"><div class="network-fill" id="networkBar"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">随身银钱</div>
                <div class="stat-value" style="color:#b8860b">￥<span id="goldValue">20</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">局势</div>
                <div id="passiveNotice" style="color:#a0522d; font-size: 0.8em; font-weight:bold;"></div>
            </div>
        </div>
        
        <div class="scene-container">
            <h2 id="dayDisplay" style="margin:0 0 15px 0; color:#5d432c; font-size:1.4em;"></h2>
            <div class="scene-text" id="sceneText"></div>
            <div class="actions-container" id="actionsContainer"></div>
        </div>
        <div class="game-log" id="logEntries"></div>
    </div>

    <div id="endingContainer" class="hidden full-screen">
        <div style="max-width: 700px; margin: 0 auto; background: #f8f4e9; padding: 40px; border: 2px solid #8b7355; border-radius: 15px; text-align: left;">
            <h2 id="endingTitle" style="text-align:center; color:#5d432c;"></h2>
            <div id="endingText" style="white-space: pre-line; line-height:2.2; font-size: 1.1em;"></div>
            <div id="finalStats" style="margin-top:20px; border-top:1px dashed #8b7355; padding-top:15px; font-size:0.95em; color:#8b7355; font-style: italic; text-align: center;"></div>
        </div>
        <div style="margin-top: 20px;">
            <button class="btn-large" onclick="startGame()">再 弈 一 局</button>
            <button class="btn-large" style="background:#5d432c" onclick="returnToTitle()">返 回 标 题</button>
        </div>
    </div>

    <script>
        const initialGameState = {
            day: 1, period: 0,
            periods: ['清晨', '午后', '深夜'],
            suspicion: 30, network: 1, gold: 20,
            hasKeyItem: false, hasViceNote: false, viceBetrayed: false
        };

        let gameState = {};

        const storyDatabase = {
            '1_0': {
                text: "【第一天 · 清晨】王妃叮嘱你万事小心。厨娘在走廊角落对你使了个眼色，似乎想低语什么。",
                actions: [
                    { text: "【隐忍】专心洒扫，避开厨娘视线", effect: () => { gameState.suspicion -= 15; addLog("你表现得卑微无知。"); } },
                    { text: "【探听】塞给厨娘五两银子打探情报", cost: 5, effect: () => { gameState.network += 2; gameState.suspicion += 8; gameState.gold -= 5; addLog("厨娘告诉你，她弟弟在守城门。"); } }
                ]
            },
            '1_1': {
                text: "【第一天 · 午后】将军独自在凉亭。石桌上放着军饷钱袋。他正闭目养神，并未察觉你的到来。",
                actions: [
                    { text: "【奉茶】毕恭毕敬上前，消减其怀疑", effect: () => { gameState.suspicion -= 12; addLog("将军被你的‘勤快’暂时蒙蔽。"); } },
                    { text: "【窃财】富贵险中求，偷取十五两银钱", effect: () => { gameState.gold += 15; gameState.suspicion += 15; addLog("你得手了，但搜查变严。"); } }
                ]
            },
            '1_2': {
                text: "【第一天 · 深夜】王妃交给你一枚联络旧部的玉佩，问你是否敢趁夜送信出府。",
                actions: [
                    { text: "【潜伏】今晚不出门，防止暴露行踪", effect: () => { gameState.suspicion -= 8; addLog("一夜平安。"); } },
                    { text: "【联络】重金雇更夫送密信出府", cost: 10, effect: () => { gameState.network += 3; gameState.gold -= 10; gameState.hasKeyItem = true; gameState.suspicion += 10; addLog("信已送至校尉手中。"); } }
                ]
            },
            '2_0': {
                text: "【第二天 · 清晨】卫兵正在寝宫外搜查仆从财物。若表现得过于惊慌，恐有不测。",
                actions: [
                    { text: "【配合】交出五两碎银洗清嫌疑", cost: 5, effect: () => { gameState.gold -= 5; gameState.suspicion -= 20; addLog("你表现得很配合。"); } },
                    { text: "【打点】贿赂搜查校尉换取情报", cost: 8, effect: () => { gameState.network += 2; gameState.gold -= 8; gameState.suspicion += 5; addLog("校尉给你行了方便。"); } }
                ]
            },
            '2_1': {
                text: "【第二天 · 午后】副将在走廊拦住你，言语间似在左右摇摆。他在看你的诚意。",
                actions: [
                    { text: "【游说】用大义暗示王爷的封赏 (需人脉4)", requires: () => gameState.network >= 4, effect: () => { gameState.hasViceNote = true; addLog("副将被你说动。"); } },
                    { text: "【砸钱】直接奉上十五两银子定金", cost: 15, effect: () => { gameState.network += 4; gameState.gold -= 15; gameState.hasViceNote = true; addLog("副将大喜。"); } },
                    { text: "【退避】快步离去，不做纠缠", effect: () => { gameState.suspicion += 15; addLog("副将盯着你的背影，面露凶色。"); } }
                ]
            },
            '2_2_vice': {
                text: "【第二天 · 深夜】副将在角门等候，他需要钱去买通守门亲兵。这是最后的博弈。",
                actions: [
                    { text: "【血本】掏出十两银子买通守军", cost: 10, effect: () => { gameState.network += 5; gameState.viceBetrayed = true; gameState.suspicion += 10; addLog("万事俱备。"); } },
                    { text: "【周旋】由于银两不足，只能立下字据承诺重金", effect: () => { gameState.network += 2; gameState.suspicion += 25; addLog("副将虽不满，但贪念让他决定再帮你一次。"); } }
                ]
            },
            '3_0': {
                text: "【第三天 · 清晨】将军集结部队，准备迎接最后一刻。卫兵已盯上了王妃的院落。",
                actions: [
                    { text: "【苦肉】在马前跪地祈福，极力表忠", effect: () => { gameState.suspicion -= 25; addLog("将军被你的精湛表演迷惑。"); } },
                    { text: "【死谏】拦路劝阻将军莫要一错再错", effect: () => { gameState.network += 3; gameState.suspicion += 20; addLog("将军大怒。"); } }
                ]
            },
            '3_1': {
                text: "【第三天 · 午后】信号烟火必须按时燃起。马厩就在前方。",
                actions: [
                    { text: "【纵火】点燃祠堂作为起事信号", effect: () => { 
                        gameState.suspicion += gameState.viceBetrayed ? 10 : 30;
                        addLog("火焰腾空！"); 
                    } }
                ]
            },
            '3_2': {
                text: "【第三天 · 深夜】厮杀声停息了。门被猛地推开……",
                actions: [{ text: "【终局】查看最终归宿", effect: () => {} }]
            }
        };

        function showPrologue() {
            document.getElementById('titleScreen').classList.add('hidden');
            document.getElementById('prologueScreen').classList.remove('hidden');
        }

        function startGame() {
            // 重置状态
            gameState = JSON.parse(JSON.stringify(initialGameState));
            // 切换界面
            document.getElementById('titleScreen').classList.add('hidden');
            document.getElementById('prologueScreen').classList.add('hidden');
            document.getElementById('endingContainer').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            // 清理日志
            document.getElementById('logEntries').innerHTML = "";
            loadScene();
        }

        function returnToTitle() {
            document.getElementById('endingContainer').classList.add('hidden');
            document.getElementById('gameContainer').classList.add('hidden');
            document.getElementById('titleScreen').classList.remove('hidden');
        }

        function updateDisplay() {
            gameState.suspicion = Math.max(0, Math.min(100, gameState.suspicion));
            gameState.network = Math.max(0, Math.min(10, gameState.network));
            document.getElementById('dayDisplay').textContent = `第${gameState.day}天 · ${gameState.periods[gameState.period]}`;
            document.getElementById('suspicionValue').textContent = gameState.suspicion;
            document.getElementById('networkValue').textContent = gameState.network;
            document.getElementById('goldValue').textContent = gameState.gold;
            document.getElementById('suspicionBar').style.width = gameState.suspicion + '%';
            document.getElementById('networkBar').style.width = (gameState.network * 10) + '%';
            const growth = gameState.day === 1 ? 2 : (gameState.day === 2 ? 3 : 4);
            document.getElementById('passiveNotice').textContent = gameState.day <= 3 ? `疑心上涨 +${growth}` : "";
        }

        function addLog(msg) {
            const div = document.createElement('div');
            div.style.padding = "4px 0";
            div.style.borderBottom = "1px dashed #c0b8a8";
            div.textContent = `[记录] ${msg}`;
            document.getElementById('logEntries').prepend(div);
        }

        function loadScene() {
            if (gameState.day > 3) { showEnding(); return; }
            let key = `${gameState.day}_${gameState.period}`;
            let scene = (key === '2_2' && gameState.hasViceNote) ? storyDatabase['2_2_vice'] : storyDatabase[key];
            if(!scene) scene = storyDatabase['2_2_normal'] || {text:"夜深了。", actions:[]};

            document.getElementById('sceneText').textContent = scene.text;
            const container = document.getElementById('actionsContainer');
            container.innerHTML = '';

            scene.actions.forEach(act => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                let moneyOK = (act.cost || 0) <= gameState.gold;
                let reqOK = act.requires ? act.requires() : true;
                btn.innerHTML = act.text + (act.cost ? ` (需￥${act.cost})` : "");
                btn.disabled = !(moneyOK && reqOK);
                btn.onclick = () => { act.effect(); nextPeriod(); };
                container.appendChild(btn);
            });
            updateDisplay();
        }

        function nextPeriod() {
            const growth = gameState.day === 1 ? 2 : (gameState.day === 2 ? 3 : 4);
            gameState.suspicion += growth;
            gameState.period++;
            if (gameState.period >= 3) { gameState.period = 0; gameState.day++; }
            loadScene();
        }

        function showEnding() {
            document.getElementById('gameContainer').classList.add('hidden');
            document.getElementById('endingContainer').classList.remove('hidden');
            let title = "", text = "";
            if (gameState.suspicion >= 90) {
                title = "【殒 · 功败垂成】";
                text = "将军的亲卫先一步推开了门。你在黎明前被害。";
            } else if (gameState.network >= 8 && gameState.suspicion <= 70) {
                title = "【胜 · 暗流之主】";
                text = "大军入城，副将倒戈！你赢得了这场三日豪赌，从此主宰了自己的命运。";
            } else {
                title = "【存 · 乱世余生】";
                text = "你带着王妃逃走了。虽无名利，但生命已是最好的赏赐。";
            }
            document.getElementById('endingTitle').textContent = title;
            document.getElementById('endingText').textContent = text;
            document.getElementById('finalStats').textContent = `最终结局数据 —— 疑心：${gameState.suspicion} | 人脉：${gameState.network}`;
        }
    </script>
</body>
</html>
